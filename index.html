<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Jeopardy!</title>

  <!-- App icon + home-screen settings -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#02045e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jeopardy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none; /* no pull-to-refresh while playing */
      background: #0b0c10;
    }
    body {
      box-sizing: border-box;
      /* keep the game clear of the notch / home bar when opened as an app */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe id="game" title="Daily Jeopardy" allow="fullscreen"></iframe>

  <script>
    (function () {
      var GAME_URL = 'https://script.google.com/macros/s/AKfycbynbWAGnXRfnV3qpG6KF9vkBJIo4VFqeGh7WyRE1vv17M56cGjzrzov3xweA6bK559E/exec';
      var KEY = 'jeopardy-player';

      // A personal link like .../jeopardy/?player=Sam always wins, and is remembered from then on
      var fromLink = new URLSearchParams(location.search).get('player');
      if (fromLink) { try { localStorage.setItem(KEY, fromLink); } catch (e) {} }

      var player = fromLink;
      if (!player) { try { player = localStorage.getItem(KEY); } catch (e) {} }

      // Open the game already signed in as that player (if we know who it is)
      document.getElementById('game').src = GAME_URL + (player ? '?player=' + encodeURIComponent(player) : '');

      // The game tells us who is playing, so we can remember it on this device
      window.addEventListener('message', function (e) {
        if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(e.origin)) return;
        var d = e.data;
        if (d && d.type === 'jeopardy-player' && typeof d.name === 'string' && d.name.length > 0 && d.name.length < 100) {
          try { localStorage.setItem(KEY, d.name); } catch (err) {}
        }
      });
    })();
  </script>
</body>
</html>
